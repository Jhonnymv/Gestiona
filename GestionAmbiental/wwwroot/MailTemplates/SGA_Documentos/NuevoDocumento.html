<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>
    <center>
        <table style="font-family: 'HelveticaNeueLT Std', sans-serif">
            <tr>
                <td>
                    <div style="width: 100%; height: 100%; min-width: 340px; max-width: 550px;">
                        <div style="border-radius: 10px; height: calc(100% - 175px); background-color: #ffffff">
                            <!--NOTIFICATION HEADER-->
                            <div style="border: 1px solid #EDEDED; border-bottom: none; border-radius: 0px; border-top-left-radius: 15px; border-top-right-radius: 15px; height: 250px; background-image: url('https://gestiona.marcobre.com:9190{0}'); background-size: cover; background-repeat: no-repeat">
                                <div style="height: 100%; background-color: rgba({1}, {2}, {3}, 0.75); border-top-left-radius: 15px; border-top-right-radius: 15px;">
                                    <div style="margin: 0px 20px; border-bottom: 1px solid #ffffff;">
                                        <!--<img src="https://gestiona.marcobre.com:9190/img/logo-white.png" alt="Logo Marcobre" style="padding: 10px 0px; width: 150px;">-->
                                        <img src="https://gestiona.marcobre.com:9190/img/logo-marcobre-blanco-blanco.png" alt="Logo Marcobre" style="padding: 10px 0px; width: 150px;">
                                    </div>
                                    <table style="width: 100%; height: calc(100% - 65.5px);">
                                        <tr>
                                            <td style="padding: 1px 20px">
                                                <h2 style="width: 100%; text-align: center; font-weight: bolder; color: #ffffff">Nuevo Documento</h2>
                                            </td>
                                        </tr>
                                    </table>
                                </div>
                            </div>
                            <!--END NOTIFICATION HEADER-->
                            <!--NOTIFICATION CONTENT-->
                            <div style="padding: 20px; border: 1px solid #EDEDED; border-top: none; border-bottom-left-radius: 15px; border-bottom-right-radius: 15px">

                                <!--NOTIFICATION SECTION-->
                                <div style="border: 1px solid #EDEDED; padding: 20px; background-color: #ffffff; border-radius: 10px; margin: 15px 0px;">
                                    <!--TITLE NOTIFICATION SECTION-->
                                    <div>
                                        <h3 style="text-align: center; color: #0080FF; font-weight: bolder;">Datos del Documento</h3>
                                    </div>
                                    <!--END TITLE NOTIFICATION SECTION-->

                                    <center>
                                        <!--BODY NOTIFICATION SECTION-->
                                        <table style="border-collapse: separate;border-spacing: 0 15px;">
                                            <tr>
                                                <td style="text-align: right; color: #2D649B; padding: 0 0.75em; vertical-align: middle; width: 50%">Código</td>
                                                <td style="text-align: left; color: #2D649B; font-weight: bold; padding: 0 0.75em; vertical-align: middle; width: 50%">{4}
                                            </tr>
                                            <tr>
                                                <td style="text-align: right; color: #2D649B; padding: 0 0.75em; vertical-align: middle; width: 50%">Nombre</td>
                                                <td style="text-align: left; color: #2D649B; font-weight: bold; padding: 0 0.75em; vertical-align: middle; width: 50%">{5}</td>
                                            </tr>
                                            <tr>
                                                <td style="text-align: right; color: #2D649B; padding: 0 0.75em; vertical-align: middle; width: 50%">Versión</td>
                                                <td style="text-align: left; color: #2D649B; font-weight: bold; padding: 0 0.75em; vertical-align: middle; width: 50%">{6}</td>
                                            </tr>
                                            <tr>
                                                <td style="text-align: right; color: #2D649B; padding: 0 0.75em; vertical-align: middle; width: 50%">Categoría del Documento</td>
                                                <td style="text-align: left; color: #2D649B; font-weight: bold; padding: 0 0.75em; vertical-align: middle; width: 50%">{7}</td>
                                            </tr>
                                            <tr>
                                                <td style="text-align: right; color: #2D649B; padding: 0 0.75em; vertical-align: middle; width: 50%">Tipo de Documento</td>
                                                <td style="text-align: left; color: #2D649B; font-weight: bold; padding: 0 0.75em; vertical-align: middle; width: 50%">{8}</td>
                                            </tr>
                                            <tr>
                                                <td style="text-align: right; color: #2D649B; padding: 0 0.75em; vertical-align: middle; width: 50%">Usuario Responsable</td>
                                                <td style="text-align: left; color: #2D649B; font-weight: bold; padding: 0 0.75em; vertical-align: middle; width: 50%">{9}</td>
                                            </tr>
                                            <tr>
                                                <td style="text-align: right; color: #2D649B; padding: 0 0.75em; vertical-align: middle; width: 50%">Fecha de Aprobación</td>
                                                <td style="text-align: left; color: #2D649B; font-weight: bold; padding: 0 0.75em; vertical-align: middle; width: 50%">{10}</td>
                                            </tr>
                                        </table>
                                        <!--END BODY NOTIFICATION SECTION-->
                                    </center>
                                </div>
                                <!--END NOTIFICATION SECTION-->                               
                                <!--BUTTON-->
                                <div>

                                                MÁS DETALLES
                                            </a>
                                        </div>
                                    </center>
                                </div>
                                <!--END BUTTON-->
                            </div>
                            <!--END NOTIFICATION CONTENT-->
                        </div>
                    </div>
                </td>
            </tr>
        </table>
    </center>    
</body>
</html>
